# prompt.toml - プロンプト構成 (旧 prompt_v02.toml から改名、v03 schema)。
# build_prompt() がこのファイルを読み、各セクションから抽選 → カンマ連結で prompt を作る。
# 重み付き選択は random.choices、均等選択は random.choice。
# `**word**` 等の強調記法は最終的に normalize_emphasis で `(word:1.3)` 形式に変換される。
#
# 各セクションのエントリは末尾に **LoRA キーワード** (カンマ区切り) を追加できる:
#   who         : [character, has_motion, has_wearing?, has_where?, kw?]
#   wearing     : [clothing, weight, kw?]
#   with_items  : [item, weight, kw?]
#   motion      : [motion, weight, kw?]
# 採用されたエントリの kw を全部集めて、生成のたびに pick_lora_by_keywords で:
#   - 90% : LoRA 名 (stem) に kw が部分一致するものから抽選
#   - 10% : 全 LoRA からランダム抽選 (= マッチを意図的に避ける)
# kw 列を省略した既存エントリ ([value, weight] のみ) は従来抽選にフォールバック。

# 誰が: [character, has_motion, has_wearing, has_where, lora_keywords]
# - has_motion=true → 下の [motion] セクションをスキップ (キャラ文字列に動作が内包されている)
# - has_wearing=true → 下の [wearing] 抽選をスキップ
#                      (キャラに服装情報が内包されている前提)
# - has_where=true  → 下の [at] セクションをスキップ
#                      (キャラ文字列に場所が内包されている前提、例:
#                       "a girl ware swimsuit at pool" / "a girl ware swimsuit in sea")
# - 後方互換:
#     4 要素 [char, has_motion, has_wearing, kw_str]              … v02 形式 (has_where=false)
#     3 要素 [char, has_motion, kw_str]                           … 旧 v01 形式 (kw のみ)
#   型 (bool / str) で判別する
# 例: ["**a girl ware swimsuit at pool**", false, true, true, "swimsuit, pool"]
#      ← wearing スキップ + at スキップ
# 例: ["**a naked woman**", false, true, false, ""]
#      ← wearing スキップ、at は通常抽選
# 例: ["**a girl**", false, false, false, ""]
#      ← 服装も場所もニュートラル、全セクション通常抽選
# 1 つを均等ランダム抽選
who = [
    ["**a boy**", false, false, false, ""],
    ["**a girl**", false, false, false, ""],
]

# 何を着て: [clothing, weight] または [clothing, weight, lora_keywords]
# 例: ["swimsuit", 5, "swimsuit"]
# - "nothing" → "naked" を 1 句として追加 (= 裸を明示)
# - その他 → "wearing {clothing}" を 1 句として追加
# 1 つを重み抽選
wearing = [
    ["**a cap**", 50, ""],
]

# with アクセサリ/状況: [item, weight] または [item, weight, lora_keywords]
# 例: ["jewelry", 5, "jewelry"]
# - 最大 3 回 重み抽選 (with replacement)、重複は dedupe、"nothing" は無視
# - 採用された各 item は "with {item}" として個別句に展開される
# - 採用された entry の kw もそれぞれ LoRA キーワードに加わる
with_items = [
    ["nothing", 50, ""],
    ["necklace", 5, "jewel"],
]

# 動作: [motion, weight] または [motion, weight, lora_keywords]
# 例: ["riding bike", 5, "bike"]
# - who.has_motion=true のときはスキップ
# 1 つを重み抽選
motion = [
    ["standing", 50, ""],
    ["sitting", 50, ""],
    ["lying", 20, ""],
    ["running", 20, ""],
]

# at 場所: 1 つを均等ランダム抽選、"at {place}" 形式
at = [
    "room",
    "subway station",
    "beach",
]

# with 明るさ・情景: 1 つを均等ランダム抽選、"with {lighting}" 形式
lighting = [
    "bright lighting",
    "day lighting",
    "white lighting",
]

# 必ず prompt 末尾に付加
positive_always = "***vivid color***"

# 必ず negative_prompt の本体になる (build_prompt は negative も返す)
negative_always = "***lowres, bad anatomy, worst quality, extra hand, not 5-fingers, malformed body, diffrent faces upper body and under body, malformed feet, extra feet, missing feet, deformed limbs***"
